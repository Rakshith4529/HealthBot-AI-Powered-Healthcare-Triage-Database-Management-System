{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block public_content %}
<div class="auth-bg">
  <div class="auth-card" id="forgot-card">
    <div class="auth-header">
      <div class="auth-logo">✚</div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" id="forgot-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <button type="submit" class="btn-primary btn-full" id="btn-reset">Send Reset Link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="{{ url_for('auth.login') }}" id="link-login">Back to Sign In</a></p>
  </div>
</div>
{% endblock %}
