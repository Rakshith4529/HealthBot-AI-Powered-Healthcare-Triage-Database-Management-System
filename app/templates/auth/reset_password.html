{% extends 'base.html' %}
{% block title %}Create New Password{% endblock %}

{% block public_content %}
<div class="auth-bg">
  <div class="auth-card" id="reset-card">
    <div class="auth-header">
      <div class="auth-logo">🔒</div>
      <h1 class="auth-title">New Password</h1>
      <p class="auth-subtitle">Create a secure password for your account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.reset_password') }}" id="reset-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" name="password" placeholder="Min. 8 characters"
            required minlength="8" />
          <button type="button" class="input-toggle" onclick="togglePwd('password')">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="confirm_password" name="confirm_password"
            placeholder="Repeat password" required minlength="8" />
          <button type="button" class="input-toggle" onclick="togglePwd('confirm_password')">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full" id="btn-save-pwd">Save New Password</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Cancel and return to login</a></p>
  </div>
</div>

<script>
  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }
</script>
{% endblock %}
